# Firebase App Hosting configuration for the Next.js backend.
# Secret values must be created in Google Cloud Secret Manager and are safe
# to reference here without committing the real values.
runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: AUTH_URL
    value: https://smartflow-ai--gen-lang-client-0013019253.us-central1.hosted.app
    availability:
      - RUNTIME
  - variable: GOOGLE_OAUTH_SCOPES
    value: openid email profile https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/calendar.events
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: gemini-api-key
    availability:
      - RUNTIME
  - variable: GOOGLE_CLIENT_ID
    secret: google-client-id
    availability:
      - RUNTIME
  - variable: GOOGLE_CLIENT_SECRET
    secret: google-client-secret
    availability:
      - RUNTIME
  - variable: AUTH_SECRET
    secret: auth-secret
    availability:
      - RUNTIME
